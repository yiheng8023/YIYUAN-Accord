name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout immutable Action revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test governance contracts
        run: python -m unittest discover -s tests -v
      - name: Check release manifest projection
        run: python scripts/build_release_manifest.py --check
      - name: Check generated topology projections
        run: python scripts/build_topology.py --check
      - name: Simulate routing policy
        run: python scripts/simulate_routing.py --all
      - name: Verify Harness contracts
        run: python scripts/verify.py
